<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduGEN – Reset Password</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
        /* --- CRITICAL STYLES (Backup for Dark Mode) --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Dark Slate Background */
            color: #f1f5f9;            /* Light Text */
            font-family: 'Poppins', sans-serif;
        }

        /* --- LOGO STYLES --- */
        .logo-img {
            height: 65px; width: auto; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(34, 211, 238, 0.8); 
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .logo-img:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(34, 211, 238, 0.8); }
        .logo { display: flex; align-items: center; margin-right: 15px; }

        /* --- LAYOUT STYLES --- */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav-links a {
            color: #94a3b8; text-decoration: none; margin-left: 20px; font-weight: 500;
        }
        .nav-links a:hover { color: #fff; }

        /* --- CARD STYLES --- */
        .page-shell { padding-top: 40px; padding-bottom: 40px; }
        .card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        /* --- FORM INPUTS --- */
        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            margin-top: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: #a855f7; }
        
        .btn {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white; border: none; padding: 12px 20px;
            border-radius: 8px; cursor: pointer; font-weight: 600;
            display: inline-flex; align-items: center;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .footer { text-align: center; padding: 20px; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="logo">
            <img src="assets/picture/logoEdugen.png" alt="EduGEN Logo" class="logo-img" />
        </div>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="card" style="max-width:480px; margin: 60px auto; padding: 30px; text-align: center;">
            <h2 style="font-size: 1.8rem; margin-bottom: 10px;">Reset Password</h2>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px;">
                Enter the email address associated with your account and we'll send you a link to reset your password.
            </p>

            <form id="forgotPasswordForm" class="auth-form" style="text-align: left;">
                <label style="font-size: 0.9rem; color: #cbd5e1; font-weight: 500;">
                    Email Address
                    <input type="email" id="resetEmail" required placeholder="name@example.com" />
                </label>
                
                <button type="submit" class="btn" style="width: 100%; margin-top: 20px; justify-content: center;">
                    Send Reset Link
                </button>
            </form>

            <p id="resetMessage" class="small" style="margin-top:20px; min-height: 20px;"></p>
            
            <div style="margin-top: 20px;">
                <a href="login.html" style="color: #94a3b8; font-size: 0.85rem; text-decoration: none; transition: all 0.2s;">
                    &larr; Back to Login
                </a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© <span id="currentYear"></span> EduGEN.</p>
    </footer>

  <script>
        document.getElementById("currentYear").textContent = new Date().getFullYear();

        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop the page from reloading
            
            const email = document.getElementById('resetEmail').value;
            const messageEl = document.getElementById('resetMessage');
            const submitBtn = document.querySelector('#forgotPasswordForm .btn');
            
            submitBtn.textContent = "Sending...";
            submitBtn.disabled = true;
            messageEl.textContent = "";

            try {
                // Send the email to your Flask backend
                const response = await fetch('https://edugen-backend.onrender.com/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageEl.innerHTML = "✅ Reset link sent! Check your inbox.";
                    messageEl.style.color = "#10b981"; // Green
                } else {
                    messageEl.innerHTML = "❌ " + data.message;
                    messageEl.style.color = "#ef4444"; // Red
                }
            } catch (err) {
                messageEl.innerHTML = "❌ Connection error. Is your Flask server running?";
                messageEl.style.color = "#ef4444"; // Red
            } finally {
                submitBtn.textContent = "Send Reset Link";
                submitBtn.disabled = false;
            }
        });
    </script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
