<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduGEN - Submit Feedback</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* --- LAYOUT FIXES --- */
        body { display: flex; flex-direction: column; min-height: 100vh; background-color: #0f172a; color: #f8fafc; font-family: 'Poppins', sans-serif;}
        main { flex: 1; width: 100%; max-width: 800px; margin: 40px auto; padding: 0 20px; }

        /* --- LOGO STYLES --- */
        .logo-img { height: 55px; width: auto; border-radius: 50%; object-fit: cover; border: 2px solid rgba(79, 70, 229, 0.3); box-shadow: 0 0 15px rgba(79, 70, 229, 0.3); transition: transform 0.3s ease; }
        .logo-img:hover { transform: scale(1.05); }

        /* --- FEEDBACK FORM STYLES --- */
        .feedback-container {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .feedback-header { text-align: center; margin-bottom: 30px; }
        .feedback-header h2 { color: #f8fafc; margin-bottom: 10px; font-size: 1.8rem; }
        .feedback-header p { color: #94a3b8; font-size: 0.95rem; }

        /* Star Rating System */
        .star-rating-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-direction: row-reverse; }
        .star-rating-container input { display: none; }
        .star-rating-container label {
            font-size: 2.5rem;
            color: #475569;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        /* Hover and Selection Logic */
        .star-rating-container label:hover,
        .star-rating-container label:hover ~ label,
        .star-rating-container input:checked ~ label {
            color: #fbbf24; /* Golden yellow */
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #cbd5e1; font-weight: 500; font-size: 0.9rem; }
        textarea.modern-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
            font-family: 'Poppins', sans-serif;
            resize: vertical;
            min-height: 120px;
        }
        textarea.modern-input:focus { border-color: #a855f7; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }

        #statusMessage { text-align: center; margin-top: 15px; font-weight: 500; font-size: 0.9rem; }
        .success-text { color: #10b981; }
        .error-text { color: #ef4444; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="logo">
            <img src="assets/picture/logoEdugen.png" alt="EduGEN Logo" class="logo-img" />
        </div>
        <div style="display: flex; justify-content: space-between; flex: 1; align-items: center; width: 100%;">
            <nav class="nav-links" style="margin-left: 40px; gap: 32px;">
                <a href="home.html">Home</a>
                <a href="assessment.html">Assessment</a> 
                <a href="dashboard.html">Dashboard</a>
                <a href="lab.html">AI Lab</a>
                <a href="feedback.html" class="active" style="color: #a855f7; font-weight: 600;">Feedback</a>
            </nav>
            <div class="nav-auth" style="display: flex; align-items: center; gap: 20px;">
                <a href="about_us.html" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem; margin-right: 10px;">About Us</a>
                <a href="login.html" id="navLoginLink">Login</a>
                <a href="signup.html" id="navSignupLink" class="btn" style="padding: 6px 20px;">Sign Up</a>
                <a href="job-engine.html" id="navJobs" class="auth-only" style="display:none;">Jobs</a>
                <div class="user-nav auth-only" id="userNavContainer" style="display:none; margin: 0;">
                    <a href="profile.html" id="profileLink">Profile</a>
                    <a href="#" id="logoutLink">Logout</a>
                    <span id="welcomeText" class="welcome-text" style="margin-left: 10px; color: var(--accent);"></span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="feedback-container">
            <div class="feedback-header">
                <h2>How are we doing?</h2>
                <p>Your feedback helps us improve the EduGEN AI Workspace.</p>
            </div>

            <form id="feedbackForm">
                <div class="input-group" style="text-align: center;">
                    <label>Rate your experience</label>
                    <div class="star-rating-container">
                        <input type="radio" id="star5" name="rating" value="5" />
                        <label for="star5" title="5 stars">★</label>
                        
                        <input type="radio" id="star4" name="rating" value="4" />
                        <label for="star4" title="4 stars">★</label>
                        
                        <input type="radio" id="star3" name="rating" value="3" />
                        <label for="star3" title="3 stars">★</label>
                        
                        <input type="radio" id="star2" name="rating" value="2" />
                        <label for="star2" title="2 stars">★</label>
                        
                        <input type="radio" id="star1" name="rating" value="1" />
                        <label for="star1" title="1 star">★</label>
                    </div>
                </div>

                <div class="input-group">
                    <label for="feedbackComment">Tell us what you liked or what needs improvement:</label>
                    <textarea id="feedbackComment" class="modern-input" placeholder="e.g., The Mock Interviewer is great, but I wish..." required></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">Submit Feedback</button>
                <div id="statusMessage"></div>
            </form>
        </div>
    </main>

    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // --- AUTH LOGIC ---
            const loginLink = document.getElementById("navLoginLink");
            const signupLink = document.getElementById("navSignupLink");
            const navJobs = document.getElementById("navJobs");
            const userNavContainer = document.getElementById("userNavContainer");
            const logoutLink = document.getElementById("logoutLink");
            const welcomeText = document.getElementById("welcomeText");

            let user = null;
            try {
                const raw = localStorage.getItem("edugen_user");
                user = raw ? JSON.parse(raw) : null;
            } catch { user = null; }

            if (user && user.name) {
                loginLink.style.display = "none";
                signupLink.style.display = "none";
                navJobs.style.display = "block";
                userNavContainer.style.display = "flex";
                welcomeText.textContent = "Hi, " + user.name;
            } else {
                loginLink.style.display = "block";
                signupLink.style.display = "inline-flex";
                navJobs.style.display = "none";
                userNavContainer.style.display = "none";
            }
            
            logoutLink?.addEventListener("click", (e) => {
                e.preventDefault();
                localStorage.removeItem("edugen_user");
                window.location.href = "home.html";
            });

            // --- FEEDBACK SUBMISSION LOGIC ---
            const feedbackForm = document.getElementById('feedbackForm');
            const statusMessage = document.getElementById('statusMessage');
            const submitBtn = document.getElementById('submitBtn');

            feedbackForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Get selected rating
                const selectedStar = document.querySelector('input[name="rating"]:checked');
                if (!selectedStar) {
                    statusMessage.textContent = "Please select a star rating.";
                    statusMessage.className = "error-text";
                    return;
                }

                const rating = parseInt(selectedStar.value);
                const comment = document.getElementById('feedbackComment').value.trim();

                // Get User ID and Name if logged in, otherwise send null/Anonymous
                let userId = null;
                let userName = "Anonymous";
                if (user) {
                    userId = user.id || user.user_id || (user.user ? user.user.id : null);
                    userName = user.name;
                }

                const payload = {
                    user_id: userId,
                    user_name: userName,
                    rating: rating,
                    comment: comment
                };

                submitBtn.disabled = true;
                submitBtn.textContent = "Sending...";

                try {
                    const response = await fetch('https://edugen-backend.onrender.com/api/submit_feedback', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (data.success) {
                        feedbackForm.reset();
                        statusMessage.textContent = "Thank you! Your feedback has been sent to the Admin.";
                        statusMessage.className = "success-text";
                    } else {
                        statusMessage.textContent = "Error: " + data.error;
                        statusMessage.className = "error-text";
                    }
                } catch (err) {
                    statusMessage.textContent = "Connection error. Ensure your Flask server is running.";
                    statusMessage.className = "error-text";
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit Feedback";
                }
            });
        });
    </script>
</body>
</html>
