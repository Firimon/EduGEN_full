<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduGEN – Set New Password</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Backup styles in case CSS fails */
        body { background-color: #0f172a; color: white; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: rgba(30, 41, 59, 0.6); padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box;}
        .btn { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #4f46e5; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Set New Password</h2>
        <p style="color:#94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Enter your new password below.</p>

        <form id="newPasswordForm">
            <input type="password" id="newPassword" placeholder="New Password" required>
            <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
            <button type="submit" class="btn">Update Password</button>
        </form>

        <p id="msg" style="margin-top: 20px; font-size: 0.9rem;"></p>
        <a href="login.html" id="loginLink" style="display:none; color: #a855f7; text-decoration: none; margin-top: 15px;">Go to Login</a>
    </div>

    <script>
        // 1. Get Token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const msg = document.getElementById("msg");
        const loginLink = document.getElementById("loginLink");

        if (!token) {
            msg.textContent = "Error: Invalid link. Please request a new one.";
            msg.style.color = "red";
            document.getElementById("newPasswordForm").style.display = "none";
        }

        // 2. Handle Form Submit
        document.getElementById("newPasswordForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const p1 = document.getElementById("newPassword").value;
            const p2 = document.getElementById("confirmPassword").value;

            if (p1 !== p2) {
                msg.textContent = "Passwords do not match!";
                msg.style.color = "red";
                return;
            }

            msg.textContent = "Updating...";
            msg.style.color = "#94a3b8";

            try {
                // Send to Backend
                const res = await fetch("https://edugen-full.onrender.com/reset-password-confirm", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token, new_password: p1 })
                });

                const data = await res.json();

                if (data.success) {
                    msg.textContent = "Success! Your password has been changed.";
                    msg.style.color = "#22c55e";
                    document.getElementById("newPasswordForm").style.display = "none";
                    loginLink.style.display = "block";
                } else {
                    msg.textContent = data.message;
                    msg.style.color = "red";
                }
            } catch (err) {
                console.error(err);
                msg.textContent = "Network Error.";
                msg.style.color = "red";
            }
        });
    </script>
</body>
</html>
